<!DOCTYPE html>
<html>
<head>
    <title>LA Wealth Analysis - IRS vs Our Score</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; }
        .header {
            background: linear-gradient(135deg, #0c2c84, #1d91c0);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 24px; font-weight: 500; }
        .stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }
        .stat { text-align: center; }
        .stat-value { font-size: 20px; font-weight: bold; }
        .container {
            display: flex;
            height: calc(100vh - 70px);
        }
        .map-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #0c2c84;
        }
        .map-panel:last-child { border-right: none; }
        .map-title {
            background: #16213e;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
        }
        .map-subtitle {
            font-size: 11px;
            color: #7fcdbb;
            margin-top: 3px;
        }
        iframe {
            flex: 1;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Los Angeles Wealth Analysis - Full Area (437 Zip Codes)</h1>
        <div class="stats">
            <div class="stat">
                <div class="stat-value">0.616</div>
                <div>Correlation</div>
            </div>
            <div class="stat">
                <div class="stat-value">437</div>
                <div>Zip Codes</div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="map-panel">
            <div class="map-title">
                IRS Wealth Proxy
                <div class="map-subtitle">AGI 20% | Capital Gains 20% | Dividends 15% | Interest 10% | Business 10% | RE Tax 10% | Charity 10%</div>
            </div>
            <iframe src="map_irs_wealth_la.html"></iframe>
        </div>
        <div class="map-panel">
            <div class="map-title">
                Our Viability Score
                <div class="map-subtitle">House Price 45% | Households $200k+ 35% | Education Professional 20%</div>
            </div>
            <iframe src="map_our_viability_la.html"></iframe>
        </div>
    </div>
</body>
</html>
