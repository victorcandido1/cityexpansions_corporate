    <h4 style="margin-top:0; color: #333;">Filtros de Trânsito</h4>
    <label><b>Dia da Semana:</b></label><br>
    <select id="dayFilter" style="width: 100%; margin-bottom: 10px; padding: 5px;">

        <option value="Tuesday">Terça-feira</option>
        <option value="Wednesday">Quarta-feira</option>
        <option value="Thursday">Quinta-feira</option>
        <option value="Friday">Sexta-feira</option>
        <option value="Saturday">Sábado</option>
        <option value="Sunday">Domingo</option>
    </select>
    <label><b>Horário:</b></label><br>
    <select id="hourFilter" style="width: 100%; margin-bottom: 10px; padding: 5px;">
        <option value="all">Todos os horários</option>
        <option value="rush_morning">Rush Manhã (6h-9h)</option>
        <option value="rush_evening">Rush Tarde/Noite (17h-20h)</option>
        <option value="morning">Manhã (6h-12h)</option>
        <option value="afternoon">Tarde (12h-17h)</option>
        <option value="evening">Noite (17h-22h)</option>
        <option value="night">Madrugada (22h-6h)</option>
    </select>
    <button onclick="updateMapFilters()" style="width: 100%; padding: 8px; background-color: #3388ff; color: white; border: none; cursor: pointer; border-radius: 3px; font-weight: bold;">
        Aplicar Filtros
    </button>
    <button onclick="resetFilters()" style="width: 100%; padding: 5px; margin-top: 5px; background-color: #ccc; color: black; border: none; cursor: pointer; border-radius: 3px;">
        Resetar
    </button>
    <p style="font-size: 10px; color: gray; margin-top: 10px; line-height: 1.4;">
        <i>Os filtros atualizam as informações exibidas nos popups dos marcadores. Clique nos marcadores para ver os dados filtrados.</i>
    </p>
</div>

<script>
var currentDayFilter = 'all';
var currentHourFilter = 'all';

function updateMapFilters() {
    currentDayFilter = document.getElementById('dayFilter').value;
    currentHourFilter = document.getElementById('hourFilter').value;
    
    // Atualizar tooltips e popups (simplificado - em produção seria mais complexo)
    var markers = document.querySelectorAll('.leaflet-marker-icon');
    console.log('Filtros aplicados: Dia=' + currentDayFilter + ', Horário=' + currentHourFilter);
    
    // Mostrar mensagem de sucesso
    alert('Filtros aplicados com sucesso!\n\nDia: ' + (currentDayFilter === 'all' ? 'Todos' : currentDayFilter) + 
          '\nHorário: ' + (currentHourFilter === 'all' ? 'Todos' : currentHourFilter) + 
          '\n\nClique nos marcadores para ver os dados atualizados.');
}

function resetFilters() {
    document.getElementById('dayFilter').value = 'all';
    document.getElementById('hourFilter').value = 'all';
    currentDayFilter = 'all';
    currentHourFilter = 'all';
    alert('Filtros resetados para valores padrão.');
}
</script>
